services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      EASY_PAY_DB: /app/data/demo.sqlite3
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - demo-data:/app/data
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: http://backend:8001
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  demo-data:
